# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * WED" # run at 7:37am UTC on Wednesdays

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          - {os: ubuntu-latest,   r: 'oldrel-2'}
          - {os: ubuntu-latest,   r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: ${{ matrix.config.rspm || 'true' }}

      - name: Set parallel compilation flags (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          NCPUS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)
          echo "Detected ${NCPUS} processors"
          echo "MAKEFLAGS=-j${NCPUS}" >> ~/.Renviron

      - name: Set parallel compilation flags (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Output "Detected $env:NUMBER_OF_PROCESSORS processors"
          Add-Content -Path "$HOME\.Renviron" -Value "MAKEFLAGS=-j$env:NUMBER_OF_PROCESSORS"

      # ccache speeds up Stan model compilation dramatically on warm cache.
      # Note: Windows support via ccache-action is documented as "probably works"
      # rather than fully stable; if it causes issues, scope this step to non-Windows.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          # Key invalidates when Stan models or DESCRIPTION change.
          # Older caches partially seed new ones via restore-keys.
          key: ccache-${{ matrix.config.os }}-R-${{ matrix.config.r }}-${{ hashFiles('inst/stan/**/*.stan', 'DESCRIPTION') }}
          restore-keys: |
            ccache-${{ matrix.config.os }}-R-${{ matrix.config.r }}-
            ccache-${{ matrix.config.os }}-R-
          max-size: "2G"

      - name: Install JAGS (macOS)
        if: runner.os == 'macOS'
        run: |
          # The JAGS 5 installer puts JAGS under /opt/jags; rjags >= 5 finds it
          # via /opt/jags/lib/pkgconfig-5 and the bundled pkgconf-lite.
          curl -fsSL -A "NativeHost" -o "$RUNNER_TEMP/JAGS.pkg" "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/macOS/JAGS-5.0.2-universal.pkg/download"
          sudo installer -pkg "$RUNNER_TEMP/JAGS.pkg" -target /
          rm "$RUNNER_TEMP/JAGS.pkg"
          echo "Installed JAGS version:"
          PKG_CONFIG_PATH=/opt/jags/lib/pkgconfig-5 /opt/jags/versions/pkgconf-lite/current/bin/pkg-config --modversion jags

      - name: Set macOS OpenMP env var to prevent duplicate libomp crash
        if: runner.os == 'macOS'
        run: echo "KMP_DUPLICATE_LIB_OK=TRUE" >> $GITHUB_ENV

      - name: Install data.table from source on macOS if no binary available
        if: runner.os == 'macOS'
        run: |
          HAS_BINARY=$(Rscript -e "pkgs <- tryCatch(available.packages(type='binary'), error=function(e) matrix(NA,0,0)); cat(if ('data.table' %in% rownames(pkgs)) 'yes' else 'no')")
          if [ "$HAS_BINARY" = "no" ]; then
            echo "CPPFLAGS = -I$(brew --prefix gettext)/include" >> ~/.R/Makevars
            Rscript -e "install.packages('data.table', type='source')"
          fi

      - name: Cache JAGS install (Windows)
        if: runner.os == 'Windows'
        id: cache-jags-windows
        uses: actions/cache@v6
        with:
          path: C:\Program Files\JAGS\JAGS-5.0.2
          key: jags-windows-5.0.2

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: |
          # Install JAGS based on CRAN script
          # https://svn.r-project.org/R-dev-web/trunk/WindowsBuilds/winutf8/ucrt3/r_packages/setup_checks.ps1
          if (-not(Test-Path("C:\Program Files\JAGS\JAGS-5.0.2"))) {
            mkdir temp
            cd temp
            $url = "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Windows/Rtools45/JAGS-5.0.2.exe/download"
            $inst = "..\installers\JAGS-5.0.2.exe"

            if (Test-Path("$inst")) {
              cp "$inst" jags.exe
            } elseif (-not(Test-path("jags.exe"))) {
              # -A "NativeHost" to work-around issues with redirects with the default
              curl.exe -L -A "NativeHost" -o jags.exe "$url"
            }
            Start-Process -Wait -NoNewWindow -FilePath ".\jags.exe" -ArgumentList "/S"
            cd ..
            Remove-Item -LiteralPath "temp" -Force -Recurse
          }

      # JAGS 5 is not yet in the Ubuntu archives (they ship 4.3.2), and rjags >= 5
      # requires JAGS 5, so build it from source and cache the install.
      - name: Cache JAGS install (Linux)
        if: runner.os == 'Linux'
        id: cache-jags-linux
        uses: actions/cache@v6
        with:
          path: ~/jags-5.0.2
          key: jags-linux-${{ matrix.config.os }}-5.0.2

      - name: Install JAGS build and runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libblas-dev

      - name: Build JAGS from source (Linux)
        if: runner.os == 'Linux' && steps.cache-jags-linux.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -A "NativeHost" -o JAGS-5.0.2.tar.gz "https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Source/JAGS-5.0.2.tar.gz/download"
          tar xzf JAGS-5.0.2.tar.gz
          cd JAGS-5.0.2
          ./configure --prefix="$HOME/jags-5.0.2"
          make -j"$(nproc)"
          make install
          cd ..
          rm -rf JAGS-5.0.2 JAGS-5.0.2.tar.gz

      - name: Register JAGS with pkg-config and the dynamic linker (Linux)
        if: runner.os == 'Linux'
        run: |
          JAGS_PREFIX="$HOME/jags-5.0.2"
          # Put our JAGS 5 ahead of any JAGS 4 that pak installs from apt as a system requirement
          echo "PKG_CONFIG_PATH=$JAGS_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$JAGS_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$JAGS_PREFIX/lib" | sudo tee /etc/ld.so.conf.d/jags.conf
          sudo ldconfig
          echo "Installed JAGS version:"
          PKG_CONFIG_PATH="$JAGS_PREFIX/lib/pkgconfig" pkg-config --modversion jags

      - name: Set pak options
        shell: bash
        run: echo 'options(pkg.sysreqs_db_update_timeout = as.difftime(59, units = "secs"))' >> ~/.Rprofile

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, MendelianRandomization=?ignore-before-r=4.4.0
          needs: check
          upgrade: 'TRUE'

      # IMPORTANT: these steps must run AFTER setup-r-dependencies, not before.
      # RcppParallel's bundled TBB build derives its compiler by taking the first
      # token of `R CMD config CXX` and passing the remainder as flags, so a
      # multi-word "ccache g++" becomes -DCMAKE_CXX_COMPILER=ccache with "g++"
      # pushed into CMAKE_CXX_FLAGS. cmake then runs `ccache -I... g++ ...` and
      # ccache aborts with "invalid option -- 'I'", failing the source build on
      # jobs without package binaries (ubuntu r-devel). Dependencies therefore
      # build with a plain compiler; ccache is only enabled afterwards, which is
      # where it matters anyway (compiling this package's Stan models, plus the
      # macOS from-source rstan build below).
      - name: Configure R to use ccache (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ~/.R
          if [ "$RUNNER_OS" = "macOS" ]; then
            cat >> ~/.R/Makevars <<'EOF'
          CC = ccache clang
          CXX = ccache clang++
          CXX14 = ccache clang++
          CXX17 = ccache clang++
          CXX20 = ccache clang++
          EOF
          else
            cat >> ~/.R/Makevars <<'EOF'
          CC = ccache gcc
          CXX = ccache g++
          CXX14 = ccache g++
          CXX17 = ccache g++
          CXX20 = ccache g++
          EOF
          fi
          echo "--- ~/.R/Makevars ---"
          cat ~/.R/Makevars

      - name: Configure R to use ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.R" | Out-Null
          $makevars = @"
          CC = ccache gcc
          CXX = ccache g++
          CXX14 = ccache g++
          CXX17 = ccache g++
          CXX20 = ccache g++
          "@
          Add-Content -Path "$HOME\.R\Makevars.win" -Value $makevars
          Write-Output "--- ~/.R/Makevars.win ---"
          Get-Content "$HOME\.R\Makevars.win"

      - name: Get R library path (macOS)
        if: runner.os == 'macOS'
        id: r-libpath-macos
        shell: bash
        run: |
          LIBPATH=$(Rscript -e 'cat(.libPaths()[1])')
          echo "Detected R library path: $LIBPATH"
          echo "libpath=$LIBPATH" >> $GITHUB_OUTPUT

      - name: Cache rstan and rjags (macOS)
        if: runner.os == 'macOS'
        id: cache-rstan-rjags
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.r-libpath-macos.outputs.libpath }}/rstan
            ${{ steps.r-libpath-macos.outputs.libpath }}/rjags
            ${{ steps.r-libpath-macos.outputs.libpath }}/StanHeaders
          key: rstan-rjags-${{ matrix.config.os }}-R-${{ matrix.config.r }}-v2

      - name: Install rstan and rjags from source on macOS
        if: runner.os == 'macOS' && steps.cache-rstan-rjags.outputs.cache-hit != 'true'
        run: install.packages(c('rstan', 'rjags'), type = 'source')
        shell: Rscript {0}

      - name: Show ccache stats before check
        shell: bash
        run: ccache -s

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"error"'

      - name: Show ccache stats after check
        if: always()
        shell: bash
        run: ccache -s
